[project]
name = "sop-assistant"
version = "0.1.0"
description = "Asisten tanya-jawab SOP on-device (Qdrant hybrid + bge-m3 + Ollama) dengan sitasi dokumen dan halaman."
# Python 3.12 dipin lewat .python-version. 3.14+ dihindari karena wheel torch belum tentu tersedia.
requires-python = ">=3.11,<3.14"
dependencies = [
    "pymupdf>=1.24.3",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "FlagEmbedding>=1.3,<1.5",
    "torch>=2.4",
    "qdrant-client>=1.19,<1.21",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
sop = "sop_assistant.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sop_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
