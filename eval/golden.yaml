# Golden set evaluasi. Isi mengikuti BRIEF (bagian 6.1); expected_chunks memakai chunk_id final.
# Jangan diubah agar skor terlihat bagus: kegagalan adalah bahan catatan evaluasi.
#
# expected_reason hanya untuk needs_review (partial | ambiguous | conflict).
# must_include dicek setelah normalisasi: huruf kecil, angka kata -> angka ("dua" = "2").
# Sitasi dianggap tepat jika minimal satu expected_chunk disitasi; untuk multi_hop dan
# ambiguous, semua expected_chunk harus disitasi.

- id: q01
  category: factual
  question: "Berapa target respons awal untuk tiket P2?"
  expected_status: answered
  expected_chunks: ["KB01-p1-s04"]
  must_include: ["1 jam"]

- id: q02
  category: factual
  question: "Jam layanan reguler kapan saja?"
  expected_status: answered
  expected_chunks: ["KB03-p1-s01"]
